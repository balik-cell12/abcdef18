<!DOCTYPE html> 
<html lang="en">
<head>
  <meta name="viewport" class="wiewport" content="width=device-width,initial-scale=1, user-scalable=no" />
  <meta charset="UTF-8" />
  <title>pixtax</title>
</head>
<body>
     <div id="canvas-container">
      <canvas id="pixel-canvas"></canvas>
     </div>

  <div id="pixtax">
  Merhaba<br>Dünya!   
  </div>

  <!-- CONTROLS! -->
  <div id="controls" class="controls">
     <select id="color-picker">
       <option value="#e30737">kırmızı</option>
       <option value="#02BE01">yeşil</option>
       <option value="#1e90ff">mavi</option>
       <option value="#9c15d1">mor</option>
       <option value="#c3c706">sarı</option>
       <option value="#ff7f00">turuncu</option>
       <option value="#000000BF">void🤔</option>
     </select>
  <div id="coord-text">0, 0</div>
  <button id="darktoggle">Karanlık Mod</button>
  </div>

    <div id="alert" style="display:none;">
    <div id="messageBox">
      <div>Bots/scripts are allowed on this site.</div>
      <button id="confirmBtn">OK</button>
    </div>
  </div>

<script>
    window.onload = function() {
      if (!localStorage.getItem("message")) {
        document.getElementById("alert").style.display = "flex";
      }
      document.getElementById("confirmBtn").onclick = function() {
        localStorage.setItem("message", "true");
        document.getElementById("alert").style.display = "none";
      };
    };
</script>

 <link rel="stylesheet" href="style.css">
 <script type="module" src="place.js"></script>
</body>
</html>
